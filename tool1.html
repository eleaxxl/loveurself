<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>練習愛自己｜隨身工具・四句話</title>
<!--FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<!--/FONTS-->
<style>
:root{
  --bg:#EDF1EF;--paper:#FBFCFB;--ink:#22303A;--ink-soft:#5B6A72;
  --teal:#2F6F73;--teal-deep:#22555A;--line:#D3DDDA;
  --cream:#F7F2E7;--gold:#C9A04A;--gold-txt:#A97B1E;--green:#1F5B54;--sage:#8EA58C;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--hand);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ===== 卡片：以 720×880 設計，外框固定為 72×88mm ===== */
.cardbox{width:72mm;height:88mm;position:relative;overflow:hidden}
.card{position:absolute;left:0;top:0;width:720px;height:880px;transform-origin:0 0;transform:scale(.377953);overflow:hidden}
.card > svg.bgart{position:absolute;inset:0;width:720px;height:880px}
.card .layer{position:absolute;inset:0}

/* 正面 */
.front{background:var(--cream)}
.front .ttl{position:absolute;left:86px;top:92px;font-size:80px;font-weight:700;color:#1E4B4E;letter-spacing:10px;line-height:1}
.front .kick{position:absolute;right:74px;top:128px;font-size:23px;color:#2A5A5C;letter-spacing:2px}
.front .list{position:absolute;left:70px;right:66px;top:262px}
.front .row{display:flex;align-items:flex-start;gap:24px;padding:18px 0 20px}
.front .row + .row{border-top:2px solid rgba(160,150,120,.28)}
.front .row:first-child{padding-top:0}
.front .disc{flex:0 0 58px;height:58px;border-radius:50%;background:radial-gradient(circle at 45% 40%,#EEF1E8 0%,#DCE4D6 55%,#C9D5C4 100%);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#2C5E5B;margin-top:-2px}
.front .say{font-size:38px;line-height:1.45;color:#22303A;letter-spacing:3px}
.front .say .q{font-size:25px;color:#6E726B;letter-spacing:1px;margin-right:14px;vertical-align:3px}
.front .say.hug{color:var(--gold-txt);font-weight:700}

/* 背面 */
.back{background:var(--green);color:#F1EEE4;text-align:center}
.back .kick{position:absolute;left:0;right:0;top:206px;font-size:30px;letter-spacing:13px;color:#EDE8DA;text-indent:13px}
.back .rule{position:absolute;left:340px;top:270px;width:40px;height:3px;background:#EDE8DA;opacity:.85}
.back .big{position:absolute;left:0;right:0;top:318px;font-size:104px;font-weight:700;letter-spacing:34px;text-indent:34px;color:#E2B862;line-height:1}
.back .ring{position:absolute;top:350px;width:22px;height:22px;border:2.5px solid #EDE8DA;border-radius:50%;opacity:.9}
.back .lines{position:absolute;left:0;right:0;top:448px;font-size:42px;line-height:1.48;letter-spacing:7px;text-indent:7px;color:#F1EEE4}
.back .lines b{color:#E2B862;font-weight:700}

/* ===== 螢幕 ===== */
.screen{max-width:820px;margin:0 auto;padding:56px 22px 70px;text-align:center}
.screen .kicker{font-family:var(--sans);font-size:13px;letter-spacing:7px;color:var(--teal);margin-bottom:16px;text-indent:7px}
.screen h1{font-size:34px;font-weight:700;letter-spacing:5px;margin:0 0 10px;color:var(--teal-deep)}
.screen .sub{font-family:var(--sans);font-size:15px;color:var(--ink-soft);letter-spacing:1.5px;line-height:1.9}
.pair{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:38px 0 6px}
.pv{width:min(340px,86vw);aspect-ratio:72/88;position:relative;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(34,48,58,.18),0 2px 6px rgba(34,48,58,.08)}
.pv .card{transform-origin:0 0}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.btns a,.btns button{font-family:var(--sans);font-size:15px;letter-spacing:.18em;border-radius:999px;padding:13px 30px;cursor:pointer;text-indent:.18em;border:1px solid var(--teal);text-decoration:none;display:inline-block}
.btns .go{color:#fff;background:var(--teal)}
.btns .ghost{color:var(--teal);background:transparent}
.how{max-width:480px;margin:34px auto 0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.how .h{font-family:var(--sans);font-size:12px;letter-spacing:4px;color:var(--teal);margin-bottom:10px}
.how ol{margin:0;padding-left:1.3em;font-family:var(--sans);font-size:14px;color:var(--ink-soft);line-height:2}
footer{margin-top:46px;color:var(--ink-soft);opacity:.6;font-family:var(--sans);font-size:12px;letter-spacing:3px}

/* ===== 列印：A4 直式，三張對折卡（左正面、右背面，沿中線往後折） ===== */
.sheet{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .screen{display:none}
  .sheet{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9mm;width:210mm;height:297mm}
  .fold{position:relative;display:flex;width:144mm;height:88mm}
  .fold i{position:absolute;background:#9aa7a5}
  .fold .h{width:3.5mm;height:.15mm}.fold .v{width:.15mm;height:3.5mm}
  .fold .h.l{left:-5mm}.fold .h.r{right:-5mm}.fold .v.t{top:-4.5mm}.fold .v.b{bottom:-4.5mm}
  .fold .h.t0{top:0}.fold .h.b0{bottom:0}.fold .v.l0{left:0}.fold .v.r0{right:0}
  .fold .v.m{left:72mm;width:0;background:none;border-left:.2mm dashed #9aa7a5}
}
</style>
</head>
<body>

<div class="screen">
  <div class="kicker">練 習 愛 自 己　·　隨 身 工 具</div>
  <h1>四句話</h1>
  <div class="sub">那個「我不夠好」的聲音來的時候，<br>對它說這四句話。</div>
  <div class="pair"><div class="pv" id="pvF"></div><div class="pv" id="pvB"></div></div>
  <div class="btns">
    <button class="go" id="printBtn">印出來</button>
    <a class="ghost" href="tool-four-lines.pdf" download>下載 PDF</a>
  </div>
  <div class="how">
    <div class="h">怎 麼 做 成 一 張 卡</div>
    <ol>
      <li>用 A4 紙印出來，一張可以做三張卡。</li>
      <li>沿著角外面的細線，把整條（正面＋背面）剪下來。</li>
      <li>從中間的虛線記號往後對折，正面、背面就都有了。</li>
      <li>用厚一點的紙印更好；想耐用，可以拿去護貝。</li>
    </ol>
  </div>
  <footer>練 習 愛 自 己　·　關 於 自 我 認 同 的 24 個 練 習</footer>
</div>

<div class="sheet" id="sheet"></div>

<script>
(function(){
  // ---------- 裝飾：葉枝、山丘、金框、紙紋 ----------
  function leaf(x,y,ang,len,w,fill,vein){
    return '<g transform="translate('+x+' '+y+') rotate('+ang+')">'
      +'<path d="M0 0 C '+len*.25+' '+(-w)+' '+len*.7+' '+(-w*.9)+' '+len+' 0 C '+len*.7+' '+(w*.9)+' '+len*.25+' '+w+' 0 0 Z" fill="'+fill+'"/>'
      +'<path d="M2 0 L '+(len*.92)+' 0" stroke="'+vein+'" stroke-width="1.6" opacity=".55"/></g>';
  }
  function sprig(ox,oy,rot,scale,c1,c2,stem){
    var g='<g transform="translate('+ox+' '+oy+') rotate('+rot+') scale('+scale+')">';
    g+='<path d="M0 0 C 70 -18 150 -60 230 -150" fill="none" stroke="'+stem+'" stroke-width="3.2" stroke-linecap="round"/>';
    var pts=[[34,-8,-58,56,15],[60,-17,40,62,16],[92,-30,-70,66,17],[122,-46,20,68,17],[150,-66,-82,64,16],[176,-88,0,60,15],[202,-116,-90,54,14],[228,-148,-40,46,13]];
    pts.forEach(function(p,i){ g+=leaf(p[0],p[1],p[2],p[3],p[4],i%2?c1:c2,stem); });
    return g+'</g>';
  }
  function frame(stroke){
    var x0=26,y0=26,x1=694,y1=854,r=30;
    return '<path d="M'+(x0+r)+' '+y0+' H'+(x1-r)+' A'+r+' '+r+' 0 0 0 '+x1+' '+(y0+r)+' V'+(y1-r)+' A'+r+' '+r+' 0 0 0 '+(x1-r)+' '+y1+' H'+(x0+r)+' A'+r+' '+r+' 0 0 0 '+x0+' '+(y1-r)+' V'+(y0+r)+' A'+r+' '+r+' 0 0 0 '+(x0+r)+' '+y0+' Z" fill="none" stroke="'+stroke+'" stroke-width="2.2"/>';
  }
  function paper(id,op){
    return '<filter id="'+id+'" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .35  0 0 0 '+op+' 0"/></filter>'
      +'<rect width="720" height="880" filter="url(#'+id+')"/>';
  }
  function FRONT(k){
    var svg='<svg class="bgart" viewBox="0 0 720 880" aria-hidden="true"><defs><radialGradient id="fv'+k+'" cx=".5" cy=".42" r=".75"><stop offset="0" stop-color="#FBF8F0"/><stop offset="1" stop-color="#EFE7D5"/></radialGradient></defs>'
      +'<rect width="720" height="880" fill="url(#fv'+k+')"/>'+paper('fp'+k,.10)
      +'<path d="M0 800 C 120 756 230 768 330 800 C 420 830 520 822 720 776 V880 H0 Z" fill="#C7D3C4" opacity=".5"/>'
      +'<path d="M0 832 C 150 806 280 826 420 846 C 540 862 640 846 720 832 V880 H0 Z" fill="#DCE3D6" opacity=".9"/>'
      +'<path d="M120 852 C 280 820 420 812 560 796 C 620 788 670 778 700 770" fill="none" stroke="var(--gold)" stroke-width="2.4" opacity=".85"/>'
      +frame('var(--gold)')
      +'<path d="M84 196 C 160 184 270 178 352 160 C 280 188 170 200 96 206 Z" fill="var(--gold)" opacity=".85"/>'
      +sprig(18,204,-50,.78,'#9FB39C','#B9C8B4','#7F977D')
      +sprig(676,866,-72,.74,'#A6B8A2','#C3D0BE','#7F977D')
      +'</svg>';
    return '<div class="card front">'+svg+'<div class="layer">'
      +'<div class="ttl">四句話</div><div class="kick">練習愛自己 · 隨身工具</div>'
      +'<div class="list">'
      +'<div class="row"><div class="disc">一</div><div class="say">謝謝你告訴我這些。</div></div>'
      +'<div class="row"><div class="disc">二</div><div class="say">我不是不＿＿＿。</div></div>'
      +'<div class="row"><div class="disc">三</div><div class="say">我們，我和你，只是有種<br>「不夠」的感覺。</div></div>'
      +'<div class="row"><div class="disc">四</div><div class="say hug"><span class="q">（沒有說話）</span>走上前去，<br>與你的瓦薩那擁抱。</div></div>'
      +'</div></div></div>';
  }
  function BACK(k){
    var svg='<svg class="bgart" viewBox="0 0 720 880" aria-hidden="true"><defs><radialGradient id="bv'+k+'" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#256B62"/><stop offset="1" stop-color="#174A44"/></radialGradient></defs>'
      +'<rect width="720" height="880" fill="url(#bv'+k+')"/>'+paper('bp'+k,.12)
      +'<path d="M0 740 C 140 690 260 712 360 760 C 460 806 580 790 720 730 V880 H0 Z" fill="#2E7A6F" opacity=".45"/>'
      +'<path d="M0 800 C 160 770 300 800 430 828 C 560 852 650 832 720 815 V880 H0 Z" fill="#14433D" opacity=".6"/>'
      +'<path d="M30 812 C 170 772 300 820 420 840 C 520 856 600 832 680 790" fill="none" stroke="var(--gold)" stroke-width="2.4" opacity=".9"/>'
      +frame('var(--gold)')
      +sprig(34,214,-48,.82,'#A9BFA4','#CBD7C5','#93AA90')
      +sprig(672,864,-74,.72,'#D8CFAE','#E8E0C2','#B9AE86')
      +'</svg>';
    return '<div class="card back">'+svg+'<div class="layer">'
      +'<div class="kick">練習愛自己 · 第一堂</div><div class="rule"></div>'
      +'<span class="ring" style="left:178px"></span><div class="big">匱乏</div><span class="ring" style="left:520px"></span>'
      +'<div class="lines">那個聲音來的時候，<br>不用趕它走。<br>不是不好，<br>只是「<b>不夠</b>」。</div>'
      +'</div></div>';
  }
  var pvF=document.getElementById('pvF'), pvB=document.getElementById('pvB');
  pvF.innerHTML=FRONT('s'); pvB.innerHTML=BACK('s');
  function fit(){ var s=pvF.clientWidth/720; document.querySelectorAll('.pv .card').forEach(function(c){ c.style.transform='scale('+s+')'; }); }
  window.addEventListener('resize',fit); fit();
  var marks='<i class="h l t0"></i><i class="h r t0"></i><i class="h l b0"></i><i class="h r b0"></i><i class="v t l0"></i><i class="v t r0"></i><i class="v b l0"></i><i class="v b r0"></i><i class="v t m"></i><i class="v b m"></i>';
  var h='';
  for(var i=0;i<3;i++){ h+='<div class="fold"><div class="cardbox">'+FRONT('p'+i)+'</div><div class="cardbox">'+BACK('p'+i)+'</div>'+marks+'</div>'; }
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('printBtn').addEventListener('click',function(){ window.print(); });
})();
</script>
</body>
</html>
