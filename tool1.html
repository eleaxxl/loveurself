<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>練習愛自己｜隨身工具・四句話</title>
<!--FONTS-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<!--/FONTS-->
<style>
:root{
  --bg:#EDF1EF;--paper:#FBFCFB;--ink:#22303A;--ink-soft:#5B6A72;
  --teal:#2F6F73;--teal-deep:#22555A;--light:#D9A441;--line:#D3DDDA;--mist:#BFD8D5;
  --hand:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--hand);-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ===== 卡片本體（以 mm 定尺寸：名片大小 85×54mm） ===== */
.card{width:85mm;height:54mm;position:relative;overflow:hidden;border-radius:3mm}
.front{background:var(--paper);padding:4.6mm 5.4mm 4.2mm 5.8mm;display:flex;flex-direction:column}
.front::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.6mm;background:var(--teal)}
.front .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.2mm}
.front .ttl{font-size:13.5pt;font-weight:700;color:var(--teal-deep);letter-spacing:.9pt}
.front .kick{font-family:var(--sans);font-size:5.2pt;color:var(--teal);letter-spacing:1.4pt}
.front ol{list-style:none;margin:0;padding:.6mm 0 .4mm;display:flex;flex-direction:column;justify-content:space-evenly;flex:1}
.front li{display:flex;align-items:baseline;gap:2.4mm;font-size:9.6pt;line-height:1.3;color:var(--ink);letter-spacing:.3pt;white-space:nowrap}
.front li .no{font-size:7.4pt;color:var(--teal);width:3.2mm;flex:0 0 auto}
.front li.hug{color:#B07F22;font-weight:700}
.front li .q{font-weight:400;color:var(--ink-soft);font-size:7pt;margin-right:1mm}
.front .foot{margin-top:auto;font-family:var(--sans);font-size:5pt;color:var(--ink-soft);opacity:.75;letter-spacing:1pt}

.back{background:var(--teal-deep);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5mm}
.back .soft{font-size:7.6pt;color:var(--mist);letter-spacing:.8pt;line-height:1.7}
.back .big{font-size:14pt;font-weight:700;letter-spacing:1.6pt;line-height:1.55;margin:3mm 0 3.4mm}
.back .big em{font-style:normal;color:var(--light)}
.back .dot{width:9mm;border-top:.3mm solid var(--mist);opacity:.6;margin-bottom:2.6mm}
.back .lbl{font-family:var(--sans);font-size:5pt;color:var(--mist);letter-spacing:2.2pt;opacity:.85}

/* ===== 螢幕 ===== */
.screen{max-width:760px;margin:0 auto;padding:56px 22px 70px;text-align:center}
.screen .kicker{font-family:var(--sans);font-size:13px;letter-spacing:7px;color:var(--teal);margin-bottom:16px;text-indent:7px}
.screen h1{font-size:34px;font-weight:700;letter-spacing:5px;margin:0 0 10px;color:var(--teal-deep)}
.screen .sub{font-family:var(--sans);font-size:15px;color:var(--ink-soft);letter-spacing:1.5px;line-height:1.9}
.stagebox{margin:38px auto 10px;perspective:1600px;width:min(100%,560px)}
.flipper{position:relative;width:100%;aspect-ratio:85/54;transition:transform .9s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer}
.flipper.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
.face.b{transform:rotateY(180deg)}
.face .card{box-shadow:0 18px 40px rgba(34,48,58,.18),0 2px 6px rgba(34,48,58,.08);transform-origin:center;}
.tap{font-family:var(--sans);font-size:13px;color:var(--ink-soft);opacity:.8;letter-spacing:.5px;margin:18px 0 0}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btns a,.btns button{font-family:var(--sans);font-size:15px;letter-spacing:.18em;border-radius:999px;padding:13px 30px;cursor:pointer;text-indent:.18em;border:1px solid var(--teal);text-decoration:none;display:inline-block}
.btns .go{color:#fff;background:var(--teal)}
.btns .ghost{color:var(--teal);background:transparent}
.how{max-width:470px;margin:34px auto 0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 24px}
.how .h{font-family:var(--sans);font-size:12px;letter-spacing:4px;color:var(--teal);margin-bottom:10px}
.how ol{margin:0;padding-left:1.3em;font-family:var(--sans);font-size:14px;color:var(--ink-soft);line-height:2}
footer{margin-top:46px;color:var(--ink-soft);opacity:.6;font-family:var(--sans);font-size:12px;letter-spacing:3px}

/* ===== 列印：A4 一張，四張對折卡 ===== */
.sheet{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .screen{display:none}
  .sheet{display:grid;width:210mm;height:297mm;grid-template-columns:85mm 85mm;grid-template-rows:108mm 108mm;column-gap:12mm;row-gap:22mm;justify-content:center;align-content:center}
  .fold{position:relative;width:85mm;height:108mm}
  .fold .card{border-radius:0}
  .fold .card.back{transform:rotate(180deg)}    /* 對折後，翻到背面是正的 */
  /* 裁切角線（印在卡外） */
  .fold i{position:absolute;background:#9aa7a5}
  .fold .h1,.fold .h2,.fold .h3,.fold .h4{width:4mm;height:.15mm}
  .fold .v1,.fold .v2,.fold .v3,.fold .v4{width:.15mm;height:4mm}
  .fold .h1{left:-5.5mm;top:0}.fold .h2{right:-5.5mm;top:0}.fold .h3{left:-5.5mm;bottom:0}.fold .h4{right:-5.5mm;bottom:0}
  .fold .v1{left:0;top:-5.5mm}.fold .v2{right:0;top:-5.5mm}.fold .v3{left:0;bottom:-5.5mm}.fold .v4{right:0;bottom:-5.5mm}
  /* 對折記號（中線，印在卡外） */
  .fold .f1,.fold .f2{top:54mm;width:4mm;height:0;background:none;border-top:.2mm dashed #9aa7a5}
  .fold .f1{left:-5.5mm}.fold .f2{right:-5.5mm}
}
</style>
</head>
<body>

<div class="screen">
  <div class="kicker">練 習 愛 自 己　·　隨 身 工 具</div>
  <h1>四句話</h1>
  <div class="sub">那個「我不夠好」的聲音來的時候，<br>對它說這四句話。</div>

  <div class="stagebox">
    <div class="flipper" id="flipper">
      <div class="face a" id="faceA"></div>
      <div class="face b" id="faceB"></div>
    </div>
  </div>
  <div class="tap">點一下卡片，翻到背面</div>

  <div class="btns">
    <button class="go" id="printBtn">印出來</button>
    <a class="ghost" href="tool-four-lines.pdf" download>下載 PDF</a>
  </div>

  <div class="how">
    <div class="h">怎 麼 做 成 一 張 卡</div>
    <ol>
      <li>用 A4 紙印出來，一張可以做四張卡。</li>
      <li>沿著四個角外面的細線剪下。</li>
      <li>從中間的虛線記號往後對折，正面、背面就都有了。</li>
      <li>用厚一點的紙印更好；想耐用，可以拿去護貝。</li>
    </ol>
  </div>

  <footer>練 習 愛 自 己　·　關 於 自 我 認 同 的 24 個 練 習</footer>
</div>

<div class="sheet" id="sheet"></div>

<template id="tplFront">
  <div class="card front">
    <div class="head"><div class="ttl">四句話</div><div class="kick">練習愛自己 · 隨身工具</div></div>
    <ol>
      <li><span class="no">一</span>謝謝你告訴我這些。</li>
      <li><span class="no">二</span>我不是不＿＿。</li>
      <li><span class="no">三</span>我們，我和你，只是有種「不夠」的感覺。</li>
      <li class="hug"><span class="no">四</span><span class="q">（沒有說話）</span>走上前去，與你的習氣擁抱。</li>
    </ol>
  </div>
</template>
<template id="tplBack">
  <div class="card back">
    <div class="soft">那個聲音來的時候，<br>不用趕它走。</div>
    <div class="big">不是不好，<br>只是「<em>不夠</em>」。</div>
    <div class="dot"></div>
    <div class="lbl">練 習 愛 自 己　·　第 一 堂　匱 乏</div>
  </div>
</template>

<script>
(function(){
  var F=document.getElementById('tplFront').innerHTML, B=document.getElementById('tplBack').innerHTML;
  // 螢幕：把名片尺寸放大到容器寬度
  var A=document.getElementById('faceA'), Bk=document.getElementById('faceB');
  A.innerHTML=F; Bk.innerHTML=B;
  function fit(){
    var w=document.querySelector('.stagebox').clientWidth;
    var mm=document.querySelector('.face .card').offsetWidth; // 85mm 的 px
    var s=(w/mm)*0.94;
    document.querySelectorAll('.face .card').forEach(function(c){ c.style.transform='scale('+s+')'; });
  }
  window.addEventListener('resize',fit); fit(); if(document.fonts) document.fonts.ready.then(fit);
  document.getElementById('flipper').addEventListener('click',function(){ this.classList.toggle('flip'); });
  // 列印頁：四張對折卡
  var marks='<i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i><i class="v1"></i><i class="v2"></i><i class="v3"></i><i class="v4"></i><i class="f1"></i><i class="f2"></i>';
  var one='<div class="fold">'+F+B+marks+'</div>';
  document.getElementById('sheet').innerHTML=one+one+one+one;
  document.getElementById('printBtn').addEventListener('click',function(){ window.print(); });
})();
</script>
</body>
</html>
